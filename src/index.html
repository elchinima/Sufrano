<!doctype html>
<html lang="en" style="background-color: #24050d; color-scheme: dark;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4a0e1c" />
  <meta name="description" content="Süfrano — Fine Dining & Restaurant Experience. Discover signature dishes, warm hospitality, and exclusive club rewards." />
  <title>Süfrano</title>
  <script>
    (function () {
      var loc = window.location;
      var path = loc.pathname.replace(/\\/g, '/');
      var baseHref = '/';
      var assetBase = '';
      if (loc.protocol === 'file:') {
        baseHref = path.substring(0, path.lastIndexOf('/') + 1);
        assetBase = baseHref.replace(/\/$/, '');
      } else if (path === '/src' || path.indexOf('/src/') === 0) {
        baseHref = '/src/';
        assetBase = '/src';
      }
      document.write('<base href="' + baseHref + '" />');
      window.__SUFRANO_BASE__ = assetBase;

      var isSeparateLocalDev =
        loc.protocol === 'file:' ||
        ((loc.hostname === 'localhost' || loc.hostname === '127.0.0.1') &&
          loc.port !== '' &&
          loc.port !== '5045' &&
          loc.port !== '5273' &&
          loc.port !== '7133' &&
          loc.port !== '8080');
      window.__SUFRANO_API_URL__ = isSeparateLocalDev ? 'http://localhost:5045' : '';
    })();
  </script>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/core.css" />
</head>

<body style="background-color: #24050d; margin: 0;">
  <div id="root"></div>
  <script defer src="app.core.js"></script>
</body>

</html>
